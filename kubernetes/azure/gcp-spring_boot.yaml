
name: Hello spring Boot App to AKS on Azure

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "docker/app1-hello/node"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with: 
            distribution: 'temurin' # see Support distribution
            java-version: '21'

      - name: Build and Test (Maven)
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean verify

      - name: Upload test Reports
        uses: actions/upload-artifact@v4
        with:
            name: test-reports
            path: docker/app1-hello/springboot/hello-hello-spring/target

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-python@v5
        with:
            distribution: 'temurin' # 'Support distribution'
            java-version: '21'


        name: Build JAR for Docker
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@3   
        with: 
          username: ${{secret.DOCKER_USERNAME}}
          password: ${{secret.PASSWORD}}

        
        name: Build and push Docker Image
        uses: docker/build-push-action@6
        with:
          context: docker/app1-hello/python
            push: true
            tags: 
              ${{ secrets.DOCKER_USERNAME }}/hello-springboot:latest:latest
              ${{ secrets.DOCKER_USERNAME }}/hello-springboot:latest:${{}}
              ${{ secrets.DOCKER_USERNAME }}/hello-springboot:latest:${{}}
     
    
  deploy-aks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: checkout code
        uses: 'actions/checkout@v4'

      - name: Authentication to Azure Cloud
        uses: 'google-github-actions/auth@v3'
        with:
            credential_json: ${{secret.GCP_SA_KEY}}

      - name: Configure kubectl for AkS
        run: |
           gcloud container clusters get-credentials ${{secret.}}
            --region ${{secret.GCP_REGION}}
    

      - name: Verify connection
        run: kubectl get nodes
       
      - name: Deploy to GKE (Google Kubernetes Engine)
        run: kubectl apply -f k8s/gcp/app1-hello
      
 
