apiVersion: networking.k8s.io /v1
kind: ingress
metadata:
  name: tax-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
      http:
        paths:
        # Frontend (React/Vite)
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: decode/tax-calculator-frontend:latest
          ports:
            - containerPort: 80
---
- path: /api/(.*)
            pathType: Prefix
            backend:
              service:
                name: service-a
                port:
                  number: 80