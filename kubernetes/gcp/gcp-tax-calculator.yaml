
name: tax calculator PYTHON CI/CD to EKS

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "docker/app1-hello/node"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.13'

      - name: Install Dependencies
        working-directory: docker/app1-hello/python
        # run: |
        #   npm install
        #   pip install -r requirements.txt

      - name: Run Test(if any )
        working-directory: docker/app1-hello/python
        run: |
          python -m pytest

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.13'

        name: Installing dependencies
        working-directory: docker/app2-tax-calculator/python/${{ matrix.service }}
        run: |
          pip install -m pip install -update pip
          pip install -r requirements.txt

      - name: Run Smoke Test
        working-directory: docker/app2-tax-calculator/python/${{ matrix.service }}  
      run: |
          python -m py_compile main.py
        
    docker-build-push:
      runs-on: ubuntu-latest
      needs: build-test
      strategy:
        matrix:
          service:
           -{name: service-a}, docke_name: tax-service-b, path: docker/app2-tax-calculator/python/service-b}
           -{name: service-b}, docker_name: tax-service-b, path: docker/app2-tax-calculator/python/service-b}
    step:
      - name: Checkout code
        uses: actions/checkout@v4
      


        with:
          context: docker/app1-hello/python
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-python:latest:latest

  deploy-gcp-gke:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.GCP_SA_SECRET }}
          aws-region: api-south-1

      # - name: Authenticate to Google Cloud
      #   uses: aws-actions/configuration-aws-creadentials@v5.1.1
       
      - name: Setup gcloud CLI
        use: "google-github-actions/setup-gcloud@v3"
      
      - name: Install gke_cloud-auth-plugin
        run: |
        gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure kubectl for GKE
        run: |
          gcloud container clusters get-credentials /python/${{ secrets.GKE_CLUSTER_NAME }} \
            --region ${{ secrets.GCP_REGION }} 

      - name: Verify the connection
        run: kubectl get nodes

      - name: Deploy to GKE(Google Kubernetes Engine)
        run: kubectl apply -f k8s/gcp/app2-tax-calculator
 
